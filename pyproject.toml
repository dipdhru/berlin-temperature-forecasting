[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "berlin-forecast"
version = "2.1.0"
description = "Leakage-controlled 1-7 day temperature forecasting for Berlin: BiLSTM vs Transformer vs Prophet"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dipanshu Singh" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "tensorflow>=2.16",
    "keras-tuner>=1.4",
    "prophet>=1.1.5",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "altair>=5"]
dev = ["pytest>=8", "ruff>=0.5", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains small neural networks (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
